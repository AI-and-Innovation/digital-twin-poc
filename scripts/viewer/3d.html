<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AirportEye Terminal 3D</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/deck.gl@9.4.0/dist.min.js"></script>
<style>
  :root {
    --bg: #f4f6f9; --panel: #ffffff; --ink: #18202b; --muted: #5d6b7e; --line: #e2e7ee; --soft: #eef2f7;
    --accent: #0b5cad; --ok: #2e9e5b; --bad: #d33f3f; --idle: #98a2b3;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f141b; --panel: #171e28; --ink: #e8edf4; --muted: #9aa6b6; --line: #273141; --soft: #1e2733; --accent: #5aa6f0; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  button { font: inherit; color: inherit; }
  #map { position: absolute; inset: 0; }
  .panel { position: absolute; z-index: 2; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 2px 10px rgba(0,0,0,.12); }
  .head { top: 12px; left: 12px; padding: 10px 12px; max-width: 360px; }
  .head h1 { font-size: 15px; margin: 0 0 2px; }
  .sub { color: var(--muted); font-size: 11px; }
  .status { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); margin-top: 6px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--idle); }
  .dot.live { background: var(--ok); } .dot.err { background: var(--bad); }
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 8px; }
  .tile { background: var(--soft); border-radius: 8px; padding: 5px 8px; }
  .tile b { display: block; font-size: 15px; font-variant-numeric: tabular-nums; }
  .tile span { color: var(--muted); font-size: 10px; }
  .tile.alert b { color: var(--bad); }
  .ctl { top: 12px; right: 12px; padding: 8px 10px; width: 250px; }
  .ctl h3 { margin: 6px 0 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .btns { display: flex; flex-wrap: wrap; gap: 4px; }
  .btn { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 3px 9px; cursor: pointer; }
  .btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .ctl input[type=range] { width: 100%; }
  .legend { bottom: 28px; left: 12px; padding: 8px 10px; font-size: 11px; max-width: 360px; }
  .legend .row { display: flex; flex-wrap: wrap; gap: 3px 10px; margin: 3px 0; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; }
  .legend .ramp { display: inline-block; width: 110px; height: 8px; vertical-align: middle; border-radius: 2px; background: linear-gradient(90deg, #e7f0fb, #6aa3dc, #3b5bb5, #6a2c91, #b0124f); }
  .follow { bottom: 28px; right: 12px; padding: 10px 12px; width: 280px; display: none; }
  .follow.on { display: block; }
  .follow dl { display: grid; grid-template-columns: auto 1fr; gap: 1px 10px; margin: 6px 0; }
  .follow dt { color: var(--muted); } .follow dd { margin: 0; }
  .tip { position: absolute; z-index: 3; pointer-events: none; background: rgba(24,32,43,.92); color: #fff; padding: 6px 8px; border-radius: 6px; font-size: 12px; max-width: 260px; }
  a { color: var(--accent); }
  @media (max-width: 760px) { .ctl { width: 200px; } .legend, .head .tiles { display: none; } }
</style>
</head>
<body>
<div id="map"></div>

<div class="panel head">
  <h1>Terminal 1 in 3D</h1>
  <div class="sub">Departures level above, arrivals below. Drag to pan, right-drag or Ctrl-drag to tilt and rotate. <a href="./">2D dashboard</a></div>
  <div class="status"><span class="dot" id="dot"></span><span id="statusText">Connecting...</span> <b id="clock"></b></div>
  <div class="tiles">
    <div class="tile"><b id="kIn">-</b><span>in terminal</span></div>
    <div class="tile"><b id="kQ">-</b><span>queuing</span></div>
    <div class="tile" id="alertTile"><b id="kAlerts">-</b><span>over target</span></div>
  </div>
</div>

<div class="panel ctl">
  <h3>Floors</h3>
  <div class="btns" id="floorBtns"></div>
  <h3>Show</h3>
  <div class="btns" id="layerBtns"></div>
  <h3>Floor spacing <span id="spaceLbl"></span></h3>
  <input type="range" id="spacing" min="1" max="6" step="0.5" value="3" aria-label="Floor spacing">
  <h3>Camera</h3>
  <div class="btns">
    <button class="btn" data-view="overview">Overview</button>
    <button class="btn" data-view="central">Central building</button>
    <button class="btn" data-view="top">Top down</button>
  </div>
</div>

<div class="panel legend" id="legend"></div>
<div class="panel follow" id="follow"></div>
<div class="tip" id="tip" hidden></div>

<script>
(function () {
  "use strict";
  var ACT = { walking: [47, 111, 222], queuing: [240, 140, 0], in_service: [156, 54, 181], dwelling: [12, 166, 120], at_gate: [73, 80, 87], reclaim: [232, 89, 12] };
  var ACT_LABEL = { walking: "Walking", queuing: "Queuing", in_service: "Being served", dwelling: "Shops / seating", at_gate: "At gate", reclaim: "Baggage reclaim", boarded: "Boarded", exited: "Left the terminal" };
  var STATUS = { normal: [46, 158, 91], busy: [217, 145, 0], congested: [211, 63, 63], no_target: [138, 148, 166] };
  var RAMP = [[231, 240, 251], [106, 163, 220], [59, 91, 181], [106, 44, 145], [176, 18, 79]];
  var DENSE = 25;
  var CENTER = [78.4290, 17.2356];

  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s === null || s === undefined ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function nice(id) { return id ? String(id).replace(/^SYN-HYD-/, "").replace(/^ZONE-/, "") : "-"; }
  function secs(v) { return v === null || v === undefined ? "-" : (v >= 90 ? (v / 60).toFixed(1) + " min" : Math.round(v) + " s"); }
  function hhmm(ms) { return ms ? new Date(ms).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false }) : ""; }
  function ramp(d) { return RAMP[Math.max(0, Math.min(4, Math.floor(d / (DENSE / 4))))]; }
  function rgb(c) { return "rgb(" + c.join(",") + ")"; }

  var map = new maplibregl.Map({
    container: "map",
    style: { version: 8, sources: { osm: { type: "raster", tiles: ["https://tile.openstreetmap.org/{z}/{x}/{y}.png"], tileSize: 256, maxzoom: 19,
      attribution: "&copy; OpenStreetMap contributors" } }, layers: [{ id: "osm", type: "raster", source: "osm", paint: { "raster-saturation": -0.6, "raster-opacity": 0.75 } }] },
    center: CENTER, zoom: 16.6, pitch: 58, bearing: -18, maxPitch: 80, antialias: true
  });
  map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), "bottom-right");
  var overlay = new deck.MapboxOverlay({ interleaved: false, layers: [], getTooltip: null });
  map.addControl(overlay);

  var layout = null, data = null, following = null, followData = null;
  var floorsOn = { L1: true, L0: true }, show = { shell: true, slabs: true, pax: true, queues: true, density: false };
  var spacing = 3;

  function z(floor) { var f = layout && layout.floors && layout.floors[floor]; return (f ? f.z : 0) * spacing; }

  // ---- controls ----
  function buttons() {
    var fb = $("floorBtns"); fb.innerHTML = "";
    [["L1", "L1 Departures"], ["L0", "L0 Arrivals"]].forEach(function (f) {
      var b = document.createElement("button"); b.className = "btn"; b.textContent = f[1]; b.setAttribute("aria-pressed", String(floorsOn[f[0]]));
      b.onclick = function () { floorsOn[f[0]] = !floorsOn[f[0]]; buttons(); draw(); }; fb.appendChild(b);
    });
    var lb = $("layerBtns"); lb.innerHTML = "";
    [["shell", "Building"], ["slabs", "Floor zones"], ["density", "Density height"], ["pax", "Passengers"], ["queues", "Queue bars"]].forEach(function (x) {
      var b = document.createElement("button"); b.className = "btn"; b.textContent = x[1]; b.setAttribute("aria-pressed", String(show[x[0]]));
      b.onclick = function () { show[x[0]] = !show[x[0]]; buttons(); draw(); }; lb.appendChild(b);
    });
    $("spaceLbl").textContent = "(x" + spacing + ")";
  }
  $("spacing").oninput = function () { spacing = +this.value; buttons(); draw(); };
  document.querySelectorAll("[data-view]").forEach(function (b) {
    b.onclick = function () {
      var v = b.getAttribute("data-view");
      if (v === "overview") map.easeTo({ center: CENTER, zoom: 16.6, pitch: 58, bearing: -18, duration: 900 });
      if (v === "central") map.easeTo({ center: [78.4288, 17.2357], zoom: 18, pitch: 62, bearing: -25, duration: 900 });
      if (v === "top") map.easeTo({ center: CENTER, zoom: 16.8, pitch: 0, bearing: 0, duration: 900 });
    };
  });

  // ---- tooltip ----
  function tip(info) {
    var t = $("tip");
    if (!info || !info.object) { t.hidden = true; return; }
    var o = info.object, html = "";
    if (info.layer.id === "pax") html = "<b>" + esc(o[0]) + "</b><br>" + esc((o[5] || "").replace(/_/g, " ")) + "<br>" + esc(ACT_LABEL[o[4]] || o[4]) + " &middot; " + esc(nice(o[8])) + "<br><i>Click to follow</i>";
    else if (info.layer.id === "queues") html = "<b>" + esc(o.touchpoint_name || nice(o.entity_id)) + "</b><br>" + o.queue_length + " waiting &middot; about " + secs(o.estimated_wait_seconds) + "<br>Target " + secs(o.target_wait_seconds) + " &middot; " + esc((o.status || "").replace("_", " ")) + " &middot; " + (o.service_channels || "-") + " open";
    else if (info.layer.id === "slabs" || info.layer.id === "density") html = "<b>" + esc(o.name) + "</b> (" + esc(o.floor) + ")<br>" + (o.count !== undefined ? o.count + " people &middot; " + o.density.toFixed(1) + " per 100 m&sup2;" : "no data yet");
    else if (info.layer.id === "shell") html = esc(o.name);
    if (!html) { t.hidden = true; return; }
    t.innerHTML = html; t.hidden = false; t.style.left = (info.x + 12) + "px"; t.style.top = (info.y + 12) + "px";
  }

  // ---- layers ----
  function ring(coords, height) { return coords.map(function (c) { return [c[0], c[1], height]; }); }

  function draw() {
    if (!layout) return;
    var layers = [];
    var zones = {}; ((data && data.zones) || []).forEach(function (zz) { zones[zz.zone_id] = zz; });
    var buildings = layout.features.filter(function (f) { return f.properties.kind === "building"; });
    var slabs = layout.features.filter(function (f) { return f.properties.kind === "zone" && floorsOn[f.properties.floor]; }).map(function (f) {
      var zz = zones[f.properties.zone_id];
      return { polygon: ring(f.geometry.coordinates[0], z(f.properties.floor)), name: f.properties.name, floor: f.properties.floor,
        count: zz ? zz.passenger_count : undefined, density: zz ? zz.density_per_100m2 || 0 : 0, base: z(f.properties.floor) };
    });
    var top = (z("L1") || 8) + 6;

    if (show.shell) {
      layers.push(new deck.PolygonLayer({ id: "shell", data: buildings, getPolygon: function (f) { return f.geometry.coordinates[0]; },
        extruded: true, wireframe: true, getElevation: top, getFillColor: [200, 210, 225, 28], getLineColor: [40, 52, 70, 160], lineWidthMinPixels: 1,
        pickable: true, parameters: { depthWriteEnabled: false }, material: false }));
      ["L0", "L1"].forEach(function (fl) {
        if (!floorsOn[fl]) return;
        layers.push(new deck.PolygonLayer({ id: "outline-" + fl, data: buildings, getPolygon: function (f) { return ring(f.geometry.coordinates[0], z(fl) + 0.05); },
          filled: true, stroked: true, getFillColor: fl === "L1" ? [250, 252, 255, 55] : [235, 240, 248, 120], getLineColor: [24, 32, 43, 220], lineWidthMinPixels: 1.5,
          parameters: { depthWriteEnabled: false } }));
      });
    }
    if (show.slabs) {
      layers.push(new deck.PolygonLayer({ id: "slabs", data: slabs, getPolygon: function (s) { return s.polygon; }, stroked: true, filled: true,
        getFillColor: function (s) { var c = ramp(s.density); return [c[0], c[1], c[2], s.count ? (s.floor === "L1" ? 95 : 140) : 25]; },
        getLineColor: [59, 91, 181, 180], lineWidthMinPixels: 1, pickable: true, parameters: { depthWriteEnabled: false },
        updateTriggers: { getFillColor: [data && data.t] } }));
    }
    if (show.density) {
      layers.push(new deck.PolygonLayer({ id: "density", data: slabs.filter(function (s) { return s.count; }),
        getPolygon: function (s) { return s.polygon; }, extruded: true, getElevation: function (s) { return Math.max(0.5, s.density * 0.8); },
        getFillColor: function (s) { var c = ramp(s.density); return [c[0], c[1], c[2], 170]; }, pickable: true,
        updateTriggers: { getFillColor: [data && data.t], getElevation: [data && data.t] } }));
    }
    if (data && show.pax) {
      var f = data.positions.fields, iF = f.indexOf("floor"), iA = f.indexOf("activity"), iX = f.indexOf("longitude"), iY = f.indexOf("latitude"), iI = f.indexOf("passenger_id");
      var rows = data.positions.rows.filter(function (r) { return floorsOn[r[iF]]; });
      layers.push(new deck.ScatterplotLayer({ id: "pax", data: rows, getPosition: function (r) { return [r[iX], r[iY], z(r[iF]) + 0.9]; },
        getRadius: function (r) { return r[iI] === following ? 2.4 : 1.0; }, radiusUnits: "meters", radiusMinPixels: 2.6, radiusMaxPixels: 10, billboard: true,
        getFillColor: function (r) { var c = ACT[r[iA]] || [134, 142, 150]; return [c[0], c[1], c[2], 235]; },
        stroked: true, getLineColor: function (r) { return r[iI] === following ? [24, 32, 43, 255] : [0, 0, 0, 0]; }, lineWidthMinPixels: 1.5,
        pickable: true, onClick: function (info) { if (info.object) startFollow(info.object[iI]); },
        updateTriggers: { getRadius: [following], getLineColor: [following], getPosition: [spacing] } }));
    }
    if (data && show.queues) {
      var tps = (data.touchpoints || []).filter(function (p) { return p.longitude !== null && floorsOn[p.floor]; });
      layers.push(new deck.ColumnLayer({ id: "queues", data: tps, diskResolution: 16, radius: 3, extruded: true, pickable: true,
        getPosition: function (p) { return [p.longitude, p.latitude, z(p.floor)]; },
        getElevation: function (p) { return 1.5 + (p.queue_length || 0) * 1.0; },
        getFillColor: function (p) { var c = STATUS[p.status] || STATUS.no_target; return [c[0], c[1], c[2], 230]; },
        updateTriggers: { getElevation: [data.t], getFillColor: [data.t], getPosition: [spacing] } }));
    }
    if (followData && followData.points && followData.points.length > 1) {
      layers.push(new deck.PathLayer({ id: "trail", data: [followData.points], widthUnits: "pixels", getWidth: 3,
        getPath: function (pts) { return pts.map(function (p) { return [p[1], p[2], z(p[3]) + 1]; }); }, getColor: [24, 32, 43, 230],
        updateTriggers: { getPath: [spacing, followData.points.length] } }));
    }
    overlay.setProps({ layers: layers, onHover: tip });
  }

  // ---- side panels ----
  function panels() {
    if (!data) return;
    var k = data.kpi || {}, st = data.stats || {}, total = 0;
    Object.keys(st.received || {}).forEach(function (key) { total += st.received[key]; });
    $("kIn").textContent = k.people_in_terminal !== undefined ? k.people_in_terminal.toLocaleString() : data.positions.rows.length;
    $("kQ").textContent = k.people_queuing !== undefined ? k.people_queuing : "-";
    var over = (data.touchpoints || []).filter(function (p) { return p.status === "congested"; });
    $("kAlerts").textContent = over.length; $("alertTile").classList.toggle("alert", over.length > 0);
    $("clock").textContent = hhmm(data.t);
    var dot = $("dot"), txt = $("statusText");
    if (st.error) { dot.className = "dot err"; txt.textContent = st.error; }
    else if (!total) { dot.className = "dot"; txt.textContent = "Waiting for data"; }
    else { dot.className = "dot live"; txt.textContent = "Live - " + (st.source || ""); }
    var counts = {}, iA = data.positions.fields.indexOf("activity"), iF = data.positions.fields.indexOf("floor");
    data.positions.rows.forEach(function (r) { if (floorsOn[r[iF]]) counts[r[iA]] = (counts[r[iA]] || 0) + 1; });
    $("legend").innerHTML = "<b>Passengers</b>" +
      '<div class="row">' + Object.keys(ACT).map(function (a) { return '<span><i style="background:' + rgb(ACT[a]) + '"></i>' + ACT_LABEL[a] + " " + (counts[a] || 0) + "</span>"; }).join("") + "</div>" +
      '<b>Queue bars</b> (height = people waiting)<div class="row"><span><i style="background:' + rgb(STATUS.normal) + '"></i>On target</span><span><i style="background:' + rgb(STATUS.busy) + '"></i>Busy</span><span><i style="background:' + rgb(STATUS.congested) + '"></i>Over target</span><span><i style="background:' + rgb(STATUS.no_target) + '"></i>No target</span></div>' +
      '<div class="row"><span>Zone density</span><span class="ramp"></span><span>' + DENSE + "+ per 100 m&sup2;</span></div>" +
      '<div class="sub">Outline: OpenStreetMap. Interior: schematic. Floors drawn ' + spacing + "x further apart than real.</div>";
  }

  function startFollow(id) { following = id; followData = null; fetchTrack(); draw(); }
  function fetchTrack() {
    if (!following) { $("follow").classList.remove("on"); return; }
    fetch("api/track?id=" + encodeURIComponent(following), { cache: "no-store" }).then(function (r) { return r.json(); }).then(function (d) {
      followData = d; var cur = d.current, f = d.fields, get = function (k) { return cur ? cur[f.indexOf(k)] : null; };
      $("follow").innerHTML = "<b>" + esc(following) + "</b><dl><dt>Journey</dt><dd>" + esc((get("journey") || "-").replace(/_/g, " ")) + "</dd><dt>Flight</dt><dd>" + esc(get("flight_id") || "-") +
        "</dd><dt>Gate</dt><dd>" + esc(nice(get("gate_id"))) + "</dd><dt>Now</dt><dd>" + (cur ? esc(ACT_LABEL[get("activity")] || get("activity")) + " &middot; " + esc(nice(get("indoor_zone_id"))) + " &middot; " + esc(get("floor")) : (d.ended ? "Boarded or left" : "-")) +
        '</dd></dl><button class="btn" id="stop">Stop following</button>';
      $("follow").classList.add("on");
      $("stop").onclick = function () { following = null; followData = null; $("follow").classList.remove("on"); draw(); };
      draw();
    }).catch(function () {});
  }

  function poll() {
    fetch("api/state", { cache: "no-store" }).then(function (r) { return r.json(); })
      .then(function (d) { data = d; panels(); draw(); if (following) fetchTrack(); })
      .catch(function () { $("dot").className = "dot err"; $("statusText").textContent = "Dashboard server not reachable"; });
  }

  buttons();
  // Data does not wait for the base map: the terminal draws even while (or if) tiles are still loading.
  fetch("api/layout").then(function (r) { return r.json(); }).then(function (l) { layout = l; draw(); poll(); setInterval(poll, 2000); })
    .catch(function () { $("dot").className = "dot err"; $("statusText").textContent = "Dashboard server not reachable"; });
  window.addEventListener("resize", function () { map.resize(); });
})();
</script>
</body>
</html>
